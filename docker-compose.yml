services:

  # ─── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: retax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retax_user
      POSTGRES_PASSWORD: retax_password_change_in_prod
      POSTGRES_DB: retax_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the initial schema so it runs automatically on first start
      - ./src/RealEstateTax.Infrastructure/Migrations/V1__InitialSchema.sql:/docker-entrypoint-initdb.d/V1__InitialSchema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retax_user -d retax_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retax_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=retax_db;Username=retax_user;Password=retax_password_change_in_prod"
      Jwt__Secret: "CHANGE_ME_PRODUCTION_JWT_SECRET_MIN_32_CHARS"
      Jwt__Issuer: "RealEstateTaxPlatform"
      Jwt__Audience: "RealEstateTaxPlatform"
      Jwt__ExpiryMinutes: "60"
      Storage__LocalPath: "/var/retax/uploads"
      Storage__BaseUrl: "/files"
    volumes:
      - uploads_data:/var/retax/uploads
    ports:
      - "8080:8080"
    healthcheck:
      disable: true
  # ─── pgAdmin (development only) ────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: retax_pgadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@retax.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  uploads_data:
