version: "3.9"

# ─── Intelligence stack overlay ───────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.intelligence.yml up -d
# Existing containers (postgres, retax_api, pgadmin) are unaffected.

services:
  # ── Redis: caching + ML job queue ──────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: retax_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - retax_net
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── ML Python Microservice ─────────────────────────────────────────────────
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: retax_ml
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://retax_user:${RETAX_DB_PASSWORD:-retax_password_change_in_prod}@postgres:5432/retax_db"
      REDIS_URL: "redis://redis:6379"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MODEL_ARTIFACT_PATH: "/app/models"
      INTERNAL_SECRET: "${ML_INTERNAL_SECRET:-dev-secret}"
      ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      LOG_LEVEL: "INFO"
    volumes:
      - ml_models:/app/models
    networks:
      - retax_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"    # Internal only — not exposed to host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: retax_mlflow
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: "postgresql://retax_user:${RETAX_DB_PASSWORD:-retax_password_change_in_prod}@postgres:5432/retax_db"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "/mlflow/artifacts"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - retax_net
    ports:
      - "5001:5000"   # MLflow UI accessible on host:5001
    command: >
      mlflow server
        --backend-store-uri postgresql://retax_user:${RETAX_DB_PASSWORD:-retax_password_change_in_prod}@postgres:5432/retax_db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── OSRM Route Engine (enable with --profile routing) ─────────────────────
  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: retax_osrm
    profiles: ["routing"]   # Start with: docker compose --profile routing up osrm
    restart: unless-stopped
    volumes:
      - osrm_data:/data
    networks:
      - retax_net
    expose:
      - "5000"
    command: osrm-routed --algorithm mld /data/egypt-latest.osrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  ml_models:
  mlflow_artifacts:
  osrm_data:

networks:
  retax_net:
    external: true   # Reuse network defined in docker-compose.yml
