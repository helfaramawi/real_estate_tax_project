services:

  # ─── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: retax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Both migration scripts run in order on first start (alphabetical)
      - ./src/RealEstateTax.Infrastructure/Migrations/V1__InitialSchema.sql:/docker-entrypoint-initdb.d/01_V1__InitialSchema.sql:ro
      - ./src/RealEstateTax.Infrastructure/Migrations/V2__Intelligence_Schema.sql:/docker-entrypoint-initdb.d/02_V2__Intelligence_Schema.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retax_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret:          ${JWT_SECRET}
      Jwt__Issuer:          RealEstateTaxPlatform
      Jwt__Audience:        RealEstateTaxPlatform
      Jwt__ExpiryMinutes:   ${JWT_EXPIRY_MINUTES:-60}
      MLService__InternalSecret: ${ML_INTERNAL_SECRET}
      Storage__LocalPath:   /var/retax/uploads
      Storage__BaseUrl:     /files
    volumes:
      - uploads_data:/var/retax/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retax_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

  # ─── pgAdmin (development only — enable with: --profile dev) ───────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: retax_pgadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@retax.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  uploads_data:
